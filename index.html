<style>
:root{color-scheme:light;--ink:#172c32;--muted:#52676b;--accent:#145c57;--accent2:#dcefeb;--line:#d3dfdc;--paper:#fff;--bg:#f4f7f6;--focus:#bd5900}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}.wrap{width:min(900px,100% - 32px);margin:auto;padding:22px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}.brand{font-weight:750;font-size:16px;letter-spacing:.02em}.lang{display:flex;align-items:center;gap:8px}.lang select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;color:var(--ink)}.intro,.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,48px);box-shadow:0 12px 34px #163c3510}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:750;color:var(--accent)}h1{font-size:clamp(30px,6vw,48px);line-height:1.15;margin:8px 0 16px}h2{font-size:clamp(25px,4vw,34px);line-height:1.25;margin:12px 0 20px}p{margin:0 0 16px}.notice{border-left:5px solid #d38c34;background:#fff7e9;padding:16px 18px;border-radius:8px;margin:22px 0;color:#42341f}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.primary,.secondary,.share{min-height:54px;border-radius:12px;padding:12px 22px;font-weight:700}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:white;color:var(--ink)}.share{border:0;background:#128c55;color:white}.primary:hover,.share:hover{filter:brightness(.93)}button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.hidden{display:none!important}.progress-row{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font-size:16px;margin-bottom:10px}.progress{height:10px;background:#e4eeeb;border-radius:10px;overflow:hidden;margin-bottom:30px}.bar{height:100%;background:var(--accent);width:0;transition:width .25s ease}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,38px)}.sub{color:var(--muted);font-size:16px}.opts{display:grid;gap:12px;margin-top:22px}.opt{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px;border:2px solid var(--line);border-radius:14px;cursor:pointer;min-height:64px;background:white}.opt:hover{border-color:#79aaa2}.opt:has(input:checked){background:var(--accent2);border-color:var(--accent)}.opt input{width:22px;height:22px;flex:none;margin:3px 0 0;accent-color:var(--accent)}.opt strong{display:inline-block;min-width:28px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.note{font-size:15px;color:var(--muted);margin-top:18px}.score{font-size:clamp(56px,14vw,90px);font-weight:800;letter-spacing:-.05em;line-height:1;margin:10px 0}.score small{font-size:24px;color:var(--muted);letter-spacing:0}.method{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;border:0;padding:0}.method legend{font-weight:700;margin-bottom:8px}.method label{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}.refs{margin-top:22px;font-size:14px}.refs a{color:var(--accent)}footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}

<body><main class="wrap"><header class="top"><div class="brand" id="brand">EVALUARE CLINICĂ · HAM-D</div><label class="lang"><span id="langlabel">Limba</span><select id="lang" aria-label="Limba / Language"><option value="ro">Română</option><option value="en">English</option></select></label></header>

const items=[
{r:'Stare depresivă (tristețe, deznădejde, neputință, demoralizare)',e:'Depressed mood (sadness, hopelessness, helplessness, demoralization)',max:4,o:[['Absentă.','Absent.'],['Dispoziție depresivă, pesimism, lipsă de speranță; aceste stări reies numai prin interviu.','Depressed mood, pessimism, hopelessness; these states are apparent only in the interview.'],['Aceste stări sunt raportate verbal, spontan. Plâns ocazional.','These states are reported verbally and spontaneously. Occasional crying.'],['Aceste stări sunt comunicate nonverbal prin mimica feței, postură, voce. Plâns frecvent.','These states are communicated nonverbally through facial expression, posture, or voice. Frequent crying.'],['Pacientul raportează practic doar aceste stări prin comunicare verbală și nonverbală.','The patient reports virtually only these states through verbal and nonverbal communication.']]},
{r:'Sentimente de vinovăție',e:'Feelings of guilt',max:4,o:[['Absente.','Absent.'],['Culpabilizare. Autoreproș. Simte că și-a dezamăgit cunoscuții.','Self-blame and self-reproach; feels they have disappointed people they know.'],['Idei de vinovăție sau ruminații legate de greșelile sau păcatele din trecut.','Ideas of guilt or rumination about past mistakes or sins.'],['Afecțiunea actuală este o pedeapsă. Iluzia vinovăției.','The current illness is a punishment; delusion of guilt.'],['Halucinații vizuale sau auditive acuzatoare sau amenințătoare.','Accusatory or threatening visual or auditory hallucinations.']]},
{r:'Ideație suicidară',e:'Suicidal thoughts',max:4,o:[['Absentă.','Absent.'],['Simte că viața nu merită trăită.','Feels that life is not worth living.'],['Își dorește să fi murit sau are gânduri legate de propria moarte.','Wishes they were dead or has thoughts about their own death.'],['Idei suicidare sau tentative indecise de suicid.','Suicidal thoughts or indecisive suicide attempts.'],['Încercări de suicid (orice încercare serioasă de suicid este cotată cu 4).','Suicide attempts (any serious attempt is rated 4).']]},
{r:'Insomnie de debut (dificultatea de a adormi)',e:'Initial insomnia (difficulty falling asleep)',max:2,o:[['Fără dificultăți de a adormi.','No difficulty falling asleep.'],['Se plânge că uneori nu poate să adoarmă decât după cel puțin 1½ ore.','Reports sometimes being unable to fall asleep for at least 1½ hours.'],['Se plânge că zilnic nu poate adormi.','Reports being unable to fall asleep every day.']]},
{r:'Insomnie medie (tulburări de somn)',e:'Middle insomnia (sleep disturbance)',max:2,o:[['Somn fără probleme.','No sleep problems.'],['Pacientul se plânge că nu se odihnește bine noaptea (agitație în timpul nopții).','Reports not resting well at night (restlessness during the night).'],['Treziri nocturne; orice ridicare din pat este cotată cu 2 (cu excepția trezirilor din motive fiziologice, cum este urinatul).','Waking during the night; getting out of bed is rated 2 (except for physiological reasons such as urination).']]},
{r:'Insomnie tardivă',e:'Late insomnia',max:2,o:[['Absentă.','Absent.'],['Se trezește devreme dar se întoarce la somn.','Wakes early but goes back to sleep.'],['Nu poate să adoarmă la loc odată ce s-a ridicat din pat.','Cannot fall asleep again once out of bed.']]},
{r:'Activitate profesională și hobby-urile',e:'Work and activities',max:4,o:[['Fără dificultăți.','No difficulty.'],['Idei și sentimente de incapacitate, fatigabilitate sau slăbiciune legate de activități, serviciu sau hobby-uri.','Feelings of incapacity, fatigue, or weakness related to activities, work, or hobbies.'],['Pierderea interesului față de activități, hobby-uri sau serviciu, relatată direct ori reflectată prin lipsa de interes, indecizie sau ezitare; simte că trebuie să depună efort pentru a lucra sau a face activități.','Loss of interest in activities, hobbies, or work, reported directly or reflected in lack of interest, indecision, or hesitation; feels they must make an effort to work or do activities.'],['Diminuarea timpului dedicat activităților sau scăderea productivității. Pentru pacienții internați: mai puțin de 3 ore pe zi de activități, în afara celor obligatorii.','Reduced time spent on activities or reduced productivity. For inpatients: less than 3 hours per day in activities, excluding obligatory activities.'],['A încetat orice activitate din cauza bolii actuale. Pentru pacienții internați: nu participă la nicio activitate, în afara celor obligatorii, sau nu își poate duce sarcinile la bun sfârșit fără ajutor.','Has stopped all activities because of the current illness. For inpatients: takes part in no activities other than obligatory ones, or cannot complete daily tasks without assistance.']]},
{r:'Lentoare psihică',e:'Psychomotor retardation',max:4,o:[['Vorbire și ideație normale.','Normal speech and thinking.'],['Ușoară lentoare la interviu.','Slightly slow during the interview.'],['Lentoare evidentă la interviu.','Clearly slow during the interview.'],['Interviu dificil.','Interview is difficult.'],['Stupoare completă.','Complete stupor.']]},
{r:'Agitație',e:'Agitation',max:4,o:[['Absentă.','Absent.'],['Nervozitate.','Nervousness.'],['Agitație evidentă, se joacă cu părul, își frământă mâinile.','Visible agitation; plays with hair or wrings hands.'],['Se mișcă continuu, nu poate sta într-un loc.','Moves continuously and cannot remain in one place.'],['Își frământă mâinile, își roade unghiile, își smulge părul, nu poate sta pe scaun.','Wrings hands, bites nails, pulls hair, or cannot stay seated.']]},
{r:'Anxietate psihică',e:'Psychic anxiety',max:4,o:[['Absentă.','Absent.'],['Tensiune și iritabilitate subiective.','Subjective tension and irritability.'],['Se îngrijorează din motive minore.','Worries about minor matters.'],['Expresie temătoare, anxioasă, reieșită prin limbaj sau mimica feței.','Fearful, anxious expression shown in speech or facial expression.'],['Teamă exprimată spontan, evidentă în pauza de interviu.','Fear expressed spontaneously and evident during pauses in the interview.']]},
{r:'Anxietate somatică (manifestări gastrointestinale, cardiovasculare, respiratorii, transpirații, polakiurie, tinnitus)',e:'Somatic anxiety (gastrointestinal, cardiovascular, respiratory symptoms, sweating, urinary frequency, tinnitus)',max:4,o:[['Absentă.','Absent.'],['Ușoară.','Mild.'],['Moderată.','Moderate.'],['Severă.','Severe.'],['Invalidantă.','Incapacitating.']]},
{r:'Simptome somatice gastrointestinale',e:'Gastrointestinal somatic symptoms',max:2,o:[['Absente.','Absent.'],['Scăderea apetitului, dar se hrănește fără a fi îndemnat de personal. Senzația de „piatră în stomac”.','Loss of appetite, but eats without prompting from staff. Feeling of a “stone in the stomach.”'],['Nu se hrănește dacă nu este impulsionat; necesită laxative sau altă medicație pentru simptomele intestinale.','Does not eat unless prompted; needs laxatives or other medication for intestinal symptoms.']]},
{r:'Simptome somatice generale',e:'General somatic symptoms',max:2,o:[['Absente.','Absent.'],['Senzație de greutate în extremități, spate sau cap. Dureri de spate, cefalee, mialgii. Atonie, fatigabilitate, astenie.','Heaviness in the limbs, back, or head. Back pain, headache, muscle aches, atony, fatigue, or weakness.'],['Orice simptom evident se notează cu 2.','Any clearly evident symptom is rated 2.']]},
{r:'Simptome somatice genitale (pierderea libidoului, tulburări menstruale)',e:'Genital somatic symptoms (loss of libido, menstrual disturbances)',max:2,o:[['Absente.','Absent.'],['Moderată.','Moderate.'],['Severă.','Severe.']]},
{r:'Ipohondrie',e:'Hypochondriasis',max:4,o:[['Absentă.','Absent.'],['Preocupat de sine.','Preoccupied with self.'],['Preocupat de starea de sănătate.','Preoccupied with health.'],['Acuze frecvente, cere asistență.','Frequent complaints; seeks assistance.'],['Delir ipohondriac.','Hypochondriacal delusion.']]},
{r:'Scădere în greutate',e:'Weight loss',max:2,special:true,o:[['Absentă / mai puțin de 1 kg.','Absent / less than 1 kg.'],['Probabilă după istoricul bolii / mai mult de 1 kg.','Probable by history / more than 1 kg.'],['Evidentă, afirmată de pacient / mai mult de 2 kg.','Clearly reported by patient / more than 2 kg.']]},
{r:'Percepția bolii',e:'Insight',max:2,o:[['Recunoaște și este conștient că este depresiv și suferind.','Acknowledges and is aware of being depressed and suffering.'],['Recunoaște suferința, dar o atribuie alimentației neadecvate, climatului, suprasolicitării, unei viroze, oboselii.','Acknowledges distress but attributes it to poor diet, climate, overwork, a virus, or tiredness.'],['Neagă boala.','Denies illness.']]}
];
const text={ro:{eyebrow:'Instrument pentru intervievator',title:'Scala de evaluare a depresiei Hamilton',lead:'Formular de cotare HAM-D cu 17 itemi, pentru a fi completat pe baza unui interviu clinic.',caution:'Aceasta este o scală evaluată de clinician, nu un chestionar de autodiagnostic. Răspunsurile trebuie cotate de un profesionist instruit; scorul de pe pagină este orientativ și nu stabilește un diagnostic.',period:'Perioada de referință pentru interviu: ultima săptămână. Bazați evaluarea pe interviu și pe informațiile clinice disponibile.',start:'Începe evaluarea',lang:'Limba',counter:(n)=>`Întrebarea ${n} din 17`,selected:'Răspuns selectat',pending:'Alegeți un răspuns',item:'ITEM',guidance:'Selectați o singură variantă care corespunde evaluării clinicianului.',back:'Înapoi',home:'Ieșire',foot:'Puteți reveni la itemul anterior; răspunsurile selectate se păstrează.',reslabel:'Evaluare încheiată',restitle:'Scor total',explain:'Scorul este suma cotelor celor 17 itemi (0–52). Concluzia de mai jos folosește o clasificare empirică publicată; alte praguri există.',conclusionLabel:'Concluzie orientativă: ',resultnote:'Pragurile HAM-D nu sunt universale. Clasificarea afișată este o propunere empirică dintr-un eșantion clinic și nu stabilește un diagnostic; interpretați scorul împreună cu interviul clinic și evaluarea completă.',whatsapp:'Trimite pe WhatsApp',restart:'Reîncepe',shareinfo:'Se va deschide WhatsApp cu scorul total precompletat. Nimic nu se trimite până când confirmați în WhatsApp.',footer:'Datele răspunsurilor nu sunt trimise automat și nu sunt salvate de această pagină.',safety:'Acest item nu evaluează singur riscul suicidar imediat. Întrebați direct despre ideație și intenție suicidară și urmați procedura clinică de siguranță aplicabilă.',progressLabel:'Progresul evaluării',refItems:'reguli de cotare și perioada de referință',refRange:'intervalul scorului',refClass:'clasificare empirică a severității',method:'Metoda de cotare a scăderii în greutate',hist:'A: istoricul bolii',week:'B: măsurată săptămânal',refs:'Scorarea HAM-D-17: ',confirmExit:'Doriți să ieșiți din evaluare? Progresul curent se va pierde dacă reîncepeți.'},en:{eyebrow:'Clinician rating aid',title:'Hamilton Depression Rating Scale',lead:'HAM-D 17-item rating form, to be completed on the basis of a clinical interview.',caution:'This is a clinician-rated scale, not a self-diagnosis questionnaire. A trained professional should rate the responses; the score shown here is indicative and does not establish a diagnosis.',period:'Interview reference period: the past week. Base ratings on the interview and available clinical information.',start:'Begin rating',lang:'Language',counter:(n)=>`Question ${n} of 17`,selected:'Response selected',pending:'Select a response',item:'ITEM',guidance:'Choose one option that matches the clinician’s rating.',back:'Back',home:'Exit',foot:'You can return to the previous item; selected responses are kept.',reslabel:'Rating complete',restitle:'Total score',explain:'The total is the sum of all 17 item ratings (0–52). The conclusion below uses one published empirical classification; other thresholds exist.',conclusionLabel:'Indicative conclusion: ',resultnote:'HAM-D thresholds are not universal. The classification shown is an empirical proposal from a clinical sample and does not establish a diagnosis; interpret it with the clinical interview and a full assessment.',whatsapp:'Send on WhatsApp',restart:'Start again',shareinfo:'WhatsApp will open with the total score prefilled. Nothing is sent until you confirm in WhatsApp.',footer:'Responses are not sent automatically or stored by this page.',safety:'This item alone does not assess immediate suicide risk. Ask directly about suicidal thoughts and intent, and follow the applicable clinical safety procedure.',progressLabel:'Assessment progress',refItems:'scoring rules and reference period',refRange:'score range',refClass:'empirical severity classification',method:'Weight-loss rating method',hist:'A: illness history',week:'B: weekly measurement',refs:'HAM-D-17 scoring: ',confirmExit:'Exit the rating? Current progress will be lost if you start over.'}};
let lang='ro',answers=Array(17).fill(null),i=0,weightMode='A';const $=id=>document.getElementById(id);function tr(k){return text[lang][k]}function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function renderRefs(){ $('refs').innerHTML=tr('refs')+'<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4894486/" target="_blank" rel="noopener">'+tr('refItems')+'</a> · <a href="https://site.thoracic.org/assemblies/pr/outcome-measures/anxiety-and-depression-outcome-measures" target="_blank" rel="noopener">'+tr('refRange')+'</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/23759278/" target="_blank" rel="noopener">'+tr('refClass')+'</a>.' }
function renderText(){document.documentElement.lang=lang;for(const k of ['eyebrow','title','lead','caution','period','start'])$(k).textContent=tr(k);$('langlabel').textContent=tr('lang');$('back').textContent=tr('back');$('home').textContent=tr('home');$('footnote').textContent=tr('foot');$('reslabel').textContent=tr('reslabel');$('restitle').textContent=tr('restitle');$('explain').textContent=tr('explain');$('resultnote').textContent=tr('resultnote');$('whatsapp').textContent=tr('whatsapp');$('restart').textContent=tr('restart');$('shareinfo').textContent=tr('shareinfo');$('footer').textContent=tr('footer');$('progress').setAttribute('aria-label',tr('progressLabel'));if(!$('quiz').classList.contains('hidden'))renderItem();if(!$('result').classList.contains('hidden')){renderRefs();$('conclusion').textContent=tr('conclusionLabel')+interpretation(Number($('score').textContent))}}
function renderItem(moveFocus=false){let it=items[i];$('counter').textContent=tr('counter')(i+1);$('state').textContent=answers[i]===null?tr('pending'):tr('selected');$('progress').setAttribute('aria-valuenow',i);$('bar').style.width=(i/17*100)+'%';$('itemtag').textContent=tr('item')+' '+(i+1);$('question').textContent=it[lang==='ro'?'r':'e'];$('guidance').textContent=tr('guidance');$('safetyNote').textContent=tr('safety');$('safetyNote').classList.toggle('hidden',i!==2);let spec=$('special');spec.innerHTML='';if(it.special){let field=document.createElement('fieldset');field.className='method';field.innerHTML='<legend>'+tr('method')+'</legend>';for(const [v,k] of [['A','hist'],['B','week']]){let label=document.createElement('label');label.innerHTML='<input type="radio" name="wmode" value="'+v+'" '+(weightMode===v?'checked':'')+'> '+tr(k);label.querySelector('input').onchange=()=>{weightMode=v;renderItem();document.querySelector('input[name=\"wmode\"]:checked').focus()};field.append(label)}spec.append(field)}let options=it.o;if(it.special){options=weightMode==='A'?[['Absentă.','Absent.'],['Pierdere ponderală probabilă, asociată cu afecțiunea curentă.','Probable weight loss associated with the current illness.'],['Pierdere ponderală evidentă, afirmată de pacient.','Clearly reported weight loss.']]:[['Mai puțin de 1 kg.','Less than 1 kg.'],['Mai mult de 1 kg.','More than 1 kg.'],['Mai mult de 2 kg.','More than 2 kg.']]}let root=$('opts');root.innerHTML='';options.forEach((pair,j)=>{let lab=document.createElement('label');lab.className='opt';lab.innerHTML='<input type="radio" name="answer" value="'+j+'" '+(answers[i]===j?'checked':'')+'><span><strong>'+j+'</strong>'+pair[lang==='ro'?0:1]+'</span>';lab.querySelector('input').onchange=()=>{answers[i]=j;$('state').textContent=tr('selected');setTimeout(()=>{if(i<16){i++;renderItem(true)}else finish()},180)};root.append(lab)});$('back').disabled=i===0;$('back').style.opacity=i===0?'.5':'1';if(moveFocus)$('question').focus({preventScroll:true})}
function scrollTop(){const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;window.scrollTo({top:0,behavior:reduced?'auto':'smooth'})}
function interpretation(score){if(score<=7)return lang==='ro'?'scor în intervalul 0–7 (sub pragul simptomelor depresive din clasificarea citată)':'score in the 0–7 range (below the cited classification’s depressive-symptom threshold)';if(score<=16)return lang==='ro'?'simptome depresive ușoare (8–16)':'mild depressive symptoms (8–16)';if(score<=23)return lang==='ro'?'simptome depresive moderate (17–23)':'moderate depressive symptoms (17–23)';return lang==='ro'?'simptome depresive severe (24–52)':'severe depressive symptoms (24–52)'}
function finish(){if(answers.some(x=>x===null)){i=answers.findIndex(x=>x===null);renderItem(true);return}const score=answers.reduce((s,x)=>s+x,0);$('score').textContent=score;$('conclusion').textContent=tr('conclusionLabel')+interpretation(score);renderRefs();hide('quiz');show('result');scrollTop();$('restitle').focus({preventScroll:true})}
function begin(){hide('welcome');hide('result');show('quiz');i=0;renderItem(true);scrollTop()}function restart(){answers=Array(17).fill(null);weightMode='A';hide('result');hide('quiz');show('welcome');scrollTop()}
$('lang').onchange=e=>{lang=e.target.value;renderText()};$('start').onclick=begin;$('back').onclick=()=>{if(i>0){i--;renderItem(true)}};$('home').onclick=()=>{if(confirm(tr('confirmExit')))restart()};$('restart').onclick=restart;$('whatsapp').onclick=()=>{let msg=lang==='ro'?`Scor total Scala Hamilton (HAM-D-17): ${$('score').textContent}/52.\n${$('conclusion').textContent}\nRezultat orientativ, nu diagnostic.`:`Hamilton Scale (HAM-D-17) total score: ${$('score').textContent}/52.\n${$('conclusion').textContent}\nIndicative result, not a diagnosis.`;window.open('https://wa.me/+40749255366?text='+encodeURIComponent(msg),'_blank','noopener')};renderText();
